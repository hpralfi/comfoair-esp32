# comfoair-esp32 - ESPHome configuration
# Board:     comfoair-esp32 rev 1.0 (ESP32-WROOM-32E + MAX3232, DB9 male)
# Component: https://github.com/hpralfi/esphome-comfoair (branch pc-mode),
#            a fork of https://github.com/wichers/esphome-comfoair
# Unit:      ComfoAir serial protocol over the "RS232 PC" port (9600 8N1),
#            e.g. Zehnder ComfoAir 350 / Wernig G90-380 ("CA350 luxe")
#
# Copy secrets.yaml.example to secrets.yaml and fill in your values.

substitutions:
  node_name: comfoair-esp32
  device_name: "ComfoAir"

esphome:
  name: ${node_name}
  friendly_name: "${device_name}"
  comment: "Ventilation unit via RS232"
  on_boot:
    priority: -100
    then:
      # Give the component time for its first request cycle
      - delay: 15s
      - script.execute: apply_rs232_mode

# RS232 mode of the unit (command 0x9B), measured on a CA350 with firmware 3.20:
#   mode 1 "PC only"   -> acknowledged but ignored
#   mode 3 "PC master" -> wall panel (CC-Ease / CC-Luxe) goes dark, ESP controls
#   mode 0 "end"       -> from mode 3 back to 2 "CC-Ease only": panel active,
#                         the ESP can still read and switch levels
# After a power cut the unit starts in mode 2. The unit reports its mode
# (0x9C); the board compares it with the switch every minute and only sends
# a command if it differs.
script:
  - id: apply_rs232_mode
    then:
      - lambda: |-
          const uint8_t current = id(comfoair_climate).get_rs232_mode();
          if (id(wall_panel).state) {
            if (current != 2) id(comfoair_climate).set_rs232_mode(0);
          } else {
            if (current != 3) id(comfoair_climate).set_rs232_mode(3);
          }

interval:
  - interval: 1min
    then:
      - script.execute: apply_rs232_mode

switch:
  - platform: template
    id: wall_panel
    name: "Wall panel"
    icon: mdi:remote
    optimistic: true
    # Default off = panel dark, Home Assistant is the only control.
    # Switch on to keep the CC-Ease usable in parallel.
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: apply_rs232_mode
    on_turn_off:
      - script.execute: apply_rs232_mode

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/hpralfi/esphome-comfoair
      ref: pc-mode
    components: [comfoair]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Mains powered: power saving only adds latency (360-820 ms with LIGHT)
  power_save_mode: NONE
  ap:
    ssid: ${node_name}-setup
    password: !secret wifi_fallback_ap_key

captive_portal:

# Native Home Assistant API - no MQTT needed
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 120s
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: "ESPHome version"
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Status"
  # SW3 on the board: boost ventilation for 30 minutes, then back to level 2
  - platform: gpio
    id: boost_button
    name: "Boost button"
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      then:
        - lambda: 'id(comfoair_climate).set_level(3);'
        - delay: 30min
        - lambda: 'id(comfoair_climate).set_level(2);'

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    pin: GPIO25
    num_leds: 1
    chipset: ws2812
    channel_colors: GRB

# UART2 to the unit (DB9 J2 via MAX3232 channel 1); UART0 stays for logging
uart:
  id: uart_bus
  baud_rate: 9600
  rx_pin: GPIO16
  tx_pin: GPIO17

# Second RS232 channel (screw terminal J3, MAX3232 channel 2) on GPIO32/33
# is reserved for a future panel proxy mode and not used yet.

comfoair:
  id: comfoair_climate
  name: "Ventilation"
  uart_id: uart_bus

  # Required with ESPHome 2026.8+, otherwise the config check fails with the
  # misleading "At least one of 'id:' or 'name:' is required".
  size_select:
    name: "Unit size"
    internal: true

  outside_air_temperature:
    name: "Outside air"
  supply_air_temperature:
    name: "Supply air"
  return_air_temperature:
    name: "Extract air"
  exhaust_air_temperature:
    name: "Exhaust air"

  ventilation_level:
    name: "Level"
  intake_fan_speed:
    name: "Supply fan"
  exhaust_fan_speed:
    name: "Exhaust fan"
  intake_fan_speed_rpm:
    name: "Supply fan speed"
  exhaust_fan_speed_rpm:
    name: "Exhaust fan speed"
  supply_fan_active:
    name: "Supply fan running"

  supply_air_level_absent:
    name: "Supply level 0"
  supply_air_level_low:
    name: "Supply level 1"
  supply_air_level_medium:
    name: "Supply level 2"
  supply_air_level_high:
    name: "Supply level 3"
  return_air_level_absent:
    name: "Exhaust level 0"
  return_air_level_low:
    name: "Exhaust level 1"
  return_air_level_medium:
    name: "Exhaust level 2"
  return_air_level_high:
    name: "Exhaust level 3"
  sync_fan_levels:
    name: "Write fan levels to unit"

  bypass_valve:
    name: "Bypass position"
  bypass_valve_open:
    name: "Bypass open"
  summer_mode:
    name: "Summer mode"

  filter_status:
    name: "Filter status"
  filter_status_full:
    name: "Filter dirty"
  filter_hours:
    name: "Filter hours"
  filter_warning_weeks:
    name: "Filter warning after weeks"

  frost_protection_active:
    name: "Frost protection active"
  frost_protection_level:
    name: "Frost protection level"
  preheating_active:
    name: "Preheating active"

  level0_hours:
    name: "Hours level 0"
  level1_hours:
    name: "Hours level 1"
  level2_hours:
    name: "Hours level 2"
  level3_hours:
    name: "Hours level 3"
  bypass_open_hours:
    name: "Hours bypass open"

  boost_ventilation_minutes:
    name: "Boost duration"
  bathroom_switch_on_delay_minutes:
    name: "Bathroom switch on delay"
  bathroom_switch_off_delay_minutes:
    name: "Bathroom switch off delay"
