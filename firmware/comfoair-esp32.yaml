# comfoair-esp32 - ESPHome configuration
# Board:     comfoair-esp32 rev 1.0 (ESP32-WROOM-32E + MAX3232, DB9 male)
# Component: https://github.com/hpralfi/esphome-comfoair (branch pc-mode),
#            a fork of https://github.com/wichers/esphome-comfoair
# Unit:      ComfoAir serial protocol over the "RS232 PC" port (9600 8N1),
#            e.g. Zehnder ComfoAir 350 / Wernig G90-380 ("CA350 luxe")
#
# Copy secrets.yaml.example to secrets.yaml and fill in your values.

substitutions:
  node_name: comfoair-esp32
  device_name: "ComfoAir"

esphome:
  name: ${node_name}
  friendly_name: "${device_name}"
  comment: "Ventilation unit via RS232"
  on_boot:
    priority: -100
    then:
      # Give the component time for its first request cycle
      - delay: 15s
      - script.execute: apply_rs232_mode

# RS232 mode of the unit (command 0x9B), measured on a CA350 with firmware 3.20:
#   mode 1 "PC only"   -> acknowledged but ignored
#   mode 3 "PC master" -> wall panel (CC-Ease / CC-Luxe) goes dark, ESP controls
#   mode 0 "end"       -> from mode 3 back to 2 "CC-Ease only": panel active,
#                         the ESP can still read and switch levels
# After a power cut the unit starts in mode 2. The unit reports its mode
# (0x9C); the board compares it with the switch every minute and only sends
# a command if it differs.
script:
  # Boost: highest level, back to level 2 after 30 minutes.
  # mode: restart - pressing again starts the 30 minutes over.
  - id: boost
    mode: restart
    then:
      - lambda: 'id(comfoair_climate).set_level(3);'
      - delay: 30min
      - lambda: 'id(comfoair_climate).set_level(2);'
  - id: apply_rs232_mode
    then:
      - lambda: |-
          const uint8_t current = id(comfoair_climate).get_rs232_mode();
          if (id(wall_panel).state) {
            if (current != 2) id(comfoair_climate).set_rs232_mode(0);
          } else {
            if (current != 3) id(comfoair_climate).set_rs232_mode(3);
          }

interval:
  - interval: 1min
    then:
      - script.execute: apply_rs232_mode

switch:
  - platform: template
    id: wall_panel
    name: "Wall panel"
    web_server:
      sorting_group_id: grp_ventilation
    icon: mdi:remote
    optimistic: true
    # Default off = panel dark, Home Assistant is the only control.
    # Switch on to keep the CC-Ease usable in parallel.
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: apply_rs232_mode
    on_turn_off:
      - script.execute: apply_rs232_mode

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/hpralfi/esphome-comfoair
      ref: pc-mode
    components: [comfoair]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Mains powered: power saving only adds latency (360-820 ms with LIGHT)
  power_save_mode: NONE
  ap:
    ssid: ${node_name}-setup
    password: !secret wifi_fallback_ap_key

captive_portal:

# Native Home Assistant API - no MQTT needed
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
  # Firmware upload through the web interface
  - platform: web_server

# Web interface at http://<device-ip>/ : live values, controls, settings and
# log. Authentication is required - without it anyone on the network could
# switch the unit or upload firmware.
web_server:
  port: 80
  version: 3
  # Custom UI (webui/comfoair-ui.js) instead of the default one, embedded in
  # flash - no internet needed. Remove these two lines for the stock UI.
  js_url: ""
  js_include: webui/comfoair-ui.js
  auth:
    username: !secret web_username
    password: !secret web_password
  sorting_groups:
    - id: grp_ventilation
      name: "Ventilation"
      sorting_weight: 10
    - id: grp_temperatures
      name: "Temperatures"
      sorting_weight: 20
    - id: grp_bypass
      name: "Bypass and frost protection"
      sorting_weight: 30
    - id: grp_maintenance
      name: "Filter and operating hours"
      sorting_weight: 40
    - id: grp_settings
      name: "Settings"
      sorting_weight: 50

logger:
  level: INFO

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 120s
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: "ESPHome version"
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Status"
  # SW3 on the board: boost ventilation for 30 minutes, then back to level 2
  - platform: gpio
    id: boost_button
    name: "Boost button"
    web_server:
      sorting_group_id: grp_ventilation
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      then:
        - script.execute: boost

# Boost from Home Assistant and the web interface as well
button:
  - platform: template
    name: "Boost"
    icon: mdi:fan-plus
    web_server:
      sorting_group_id: grp_ventilation
    on_press:
      - script.execute: boost

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    pin: GPIO25
    num_leds: 1
    chipset: ws2812
    channel_colors: GRB

# UART2 to the unit (DB9 J2 via MAX3232 channel 1); UART0 stays for logging
uart:
  id: uart_bus
  baud_rate: 9600
  rx_pin: GPIO16
  tx_pin: GPIO17

# Second RS232 channel (screw terminal J3, MAX3232 channel 2) on GPIO32/33
# is reserved for a future panel proxy mode and not used yet.

comfoair:
  id: comfoair_climate
  name: "Ventilation"
  uart_id: uart_bus
  web_server:
    sorting_group_id: grp_ventilation

  # Required with ESPHome 2026.8+, otherwise the config check fails with the
  # misleading "At least one of 'id:' or 'name:' is required".
  size_select:
    name: "Unit size"
    internal: true

  outside_air_temperature:
    name: "Outside air"
    web_server:
      sorting_group_id: grp_temperatures
  supply_air_temperature:
